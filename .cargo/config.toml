[alias]
bwa                = "build --workspace --all-targets"
conformance-fuzz   = "cargo run --release -p conformance -- fuzz --oracle .cache/shellcheck-oracle"
conformance-gate   = "cargo run --release -p conformance -- gate --oracle .cache/shellcheck-oracle"
conformance-shells = "cargo run --release -p conformance -- shells --iterations 300"
fmt-check          = "fmt --check"
install-bin        = "install --path=rust/crates/shellcheck-cli --bin=rshellcheck --force"
lint               = "clippy --workspace --all-targets --all-features -- -D warnings -D clippy::all"
rb                 = "run --bin"
rbr                = "run --release --bin"
shellcheck         = "rbr rshellcheck --"
