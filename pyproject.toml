[project]
name            = "shellcheck-rs-workspace"
version         = "0.0.0"
requires-python = ">=3.12"
dependencies    = ["rshellcheck-wasm"]

[dependency-groups]
dev       = [{ include-group = "lint" }, { include-group = "workspace" }]
lint      = [
  "basedpyright>=1.39.10,<1.40",                                           # https://github.com/microsoft/pyright/issues/11861
  "ruff>=0.17.0",
  "ty>=0.0.86",
]
workspace = ["rshellcheck-release"]

[tool.basedpyright]
venvPath                    = "."
venv                        = ".venv"
include                     = [".github/release", "bindings", "tools"]
exclude                     = ["**/node_modules"]
ignore                      = []
executionEnvironments       = [
  { root = ".github/release" },
  { root = "bindings/wasm/python" },
  { root = "tools" },
]
analyzeUnannotatedFunctions = true

[tool.ruff]
cache-dir = ".venv/cache/ruff"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["bindings/wasm/python", ".github/release"]

[tool.uv.sources]
rshellcheck-wasm    = { workspace = true }
rshellcheck-release = { workspace = true }
