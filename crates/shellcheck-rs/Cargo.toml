[package]
name                   = "rshellcheck-core"
version                = "1.1.0"
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Parser and analysis core of rshellcheck, a Rust port of ShellCheck"
documentation          = "https://docs.rs/rshellcheck-core"
readme                 = "README.md"
repository.workspace   = true
license.workspace      = true
keywords               = ["bash", "lint", "shell", "shellcheck", "static-analysis"]
categories             = ["development-tools", "parser-implementations"]
include                = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[lib]
name = "rshellcheck_core"
path = "src/lib.rs"

[dependencies]
# Persistent maps: the CFG analysis states share structure instead of being cloned per node.
im-rc.workspace      = true
# Runs the recursive parser and graph passes on a heap stack. A script's
# nesting depth then costs memory.
reblessive.workspace = true
# Core stays IO-free so an LSP or other tool can embed it cheaply.
# regex mirrors Haskell's regex-tdfa usage in the parser/analytics.
regex.workspace      = true

[lints]
workspace = true
