[package]
name                   = "rshellcheck"
version                = "1.1.0"
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Rust port of ShellCheck, the static analysis tool for shell scripts"
documentation          = "https://docs.rs/rshellcheck"
readme                 = "README.md"
repository.workspace   = true
license.workspace      = true
keywords               = ["bash", "cli", "lint", "shell", "shellcheck"]
categories             = ["command-line-utilities", "development-tools"]
include                = ["/src/**/*.rs", "/tests/**/*.rs", "/build.rs", "/upstream.json", "/completions/*", "/README.md", "/LICENSE"]

# cargo-binstall: release tags are `rshellcheck-v<version>`, which its default
# URL guesses never try. Archives come from `.github/release/release.py`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.i686-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
# The generator behind `cargo completions`; the binary embeds its output.
completions = ["dep:fujo-complete", "dep:fujo-core"]
schema      = ["dep:schemars"]

[[bin]]
name = "rshellcheck"
path = "src/bin/shellcheck.rs"

[dependencies]
fujo-complete              = { workspace = true, optional = true }
fujo-core                  = { workspace = true, optional = true }
rshellcheck-core.workspace = true
schemars                   = { workspace = true, optional = true }
serde.workspace            = true
serde_json.workspace       = true

[build-dependencies]
schemars             = { workspace = true, optional = true }
serde.workspace      = true
serde_json.workspace = true

[lints]
workspace = true
