[package]
name                   = "shellcheck-cli"
version                = "1.0.0"
edition.workspace      = true
rust-version.workspace = true
description            = "ShellCheck CLI and output formatters (TTY/JSON/JSON1/GCC/CheckStyle/Diff/Quiet)."
license.workspace      = true

[[bin]]
name = "rshellcheck"
path = "src/bin/shellcheck.rs"

[dependencies]
schemars                = { workspace = true, optional = true }
serde.workspace         = true
serde_json.workspace    = true
shellcheck-rs.workspace = true

[build-dependencies]
schemars             = { workspace = true, optional = true }
serde.workspace      = true
serde_json.workspace = true

[features]
schema = ["dep:schemars"]

[lints]
workspace = true
