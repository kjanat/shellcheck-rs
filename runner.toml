#:schema https://kjanat.github.io/runner/schemas/runner.toml.schema.json

[chain]
on_fail = "wait"

[install]
tools  = true
frozen = false

[output]
warnings = true
errors   = true
summary  = true
progress = true
groups   = true
timing   = true

[tasks."bench"]
source = "pyproject.toml"
pm     = "uv"
output = { progress = false }
