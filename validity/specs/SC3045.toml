#:schema ../../schemas/validity-spec.schema.json

code  = 3045
claim = "sh's printf has no -v: the command fails and x stays unset"
shell = "sh"

[snippet]
script = 'printf -v x hi >/dev/null 2>&1; echo "[$x]"'

[fixed]
script = 'x=$(printf hi); echo "[$x]"'

[[observe]]
kind    = "stdout"
snippet = "[]\n"
fixed   = "[hi]\n"
