code  = 3066
claim = "sh's test has no -G: the test errors and the else branch runs"
shell = "sh"

[snippet]
script = 'mkdir "$TMPDIR/d"; if [ -G "$TMPDIR/d" ] 2>/dev/null; then echo y; else echo n; fi'

[fixed]
script = 'mkdir "$TMPDIR/d"; if [ -n "$(find "$TMPDIR/d" -prune -group "$(id -g)")" ]; then echo y; else echo n; fi'

[[observe]]
kind    = "stdout"
snippet = "n\n"
fixed   = "y\n"
