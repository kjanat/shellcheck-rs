code  = 3047
claim = "sh has no ERR trap: the trap is rejected and never runs"
shell = "sh"

[snippet]
script = "trap 'echo caught' ERR 2>/dev/null; false; echo done"

[fixed]
script = "on_err() { echo caught; }; false || on_err; echo done"

[[observe]]
kind    = "stdout"
snippet = "done\n"
fixed   = "caught\ndone\n"
