#:schema ../../schemas/validity-spec.schema.json

code  = 3039
claim = "sh has no let: it is a missing command and x stays unset"
shell = "sh"

[snippet]
script = 'let x=1+1 2>/dev/null; echo "[$x]"'

[fixed]
script = 'x=$((1+1)); echo "[$x]"'

[[observe]]
kind    = "stdout"
snippet = "[]\n"
fixed   = "[2]\n"
