#:schema ../../schemas/validity-spec.schema.json

code  = 3031
claim = "sh does not glob a redirect target: the file name is taken literally"
shell = "sh"

[snippet]
script = ': >"$TMPDIR/out.txt"; echo hi >"$TMPDIR"/out.*; cat "$TMPDIR/out.txt"'

[fixed]
script = ': >"$TMPDIR/out.txt"; echo hi >"$TMPDIR/out.txt"; cat "$TMPDIR/out.txt"'

[[observe]]
kind    = "stdout"
snippet = ""
fixed   = "hi\n"
