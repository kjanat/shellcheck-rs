#:schema ../../schemas/validity-spec.schema.json

code  = 3014
claim = "sh's test has no ==: the test errors and the else branch runs"
shell = "sh"

[snippet]
script = "if [ a == a ] 2>/dev/null; then echo y; else echo n; fi"

[fixed]
script = "if [ a = a ]; then echo y; else echo n; fi"

[[observe]]
kind    = "stdout"
snippet = "n\n"
fixed   = "y\n"
