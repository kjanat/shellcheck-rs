code  = 3067
claim = "sh's test has no -O: the test errors and the else branch runs"
shell = "sh"

[snippet]
script = 'mkdir "$TMPDIR/d"; if [ -O "$TMPDIR/d" ] 2>/dev/null; then echo y; else echo n; fi'

[fixed]
script = 'mkdir "$TMPDIR/d"; if [ -n "$(find "$TMPDIR/d" -prune -user "$(id -u)")" ]; then echo y; else echo n; fi'

[[observe]]
kind    = "stdout"
snippet = "n\n"
fixed   = "y\n"
