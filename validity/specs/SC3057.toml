#:schema ../../schemas/validity-spec.schema.json

code  = 3057
claim = "sh has no ${x:0:1}: the expansion is a fatal bad substitution"
shell = "sh"

[snippet]
script = 'x=abc; echo "${x:0:1}" 2>/dev/null'

[fixed]
script = 'x=abc; echo "${x%"${x#?}"}"'

[[observe]]
kind    = "stdout"
snippet = ""
fixed   = "a\n"
