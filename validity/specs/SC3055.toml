#:schema ../../schemas/validity-spec.schema.json

code  = 3055
claim = "sh has no ${!a[@]}: the expansion is a fatal bad substitution"
shell = "sh"

[snippet]
script = 'a=x; echo "${!a[@]}" 2>/dev/null'

[fixed]
script = 'set -- x; i=0; for _ in "$@"; do echo "$i"; i=$((i+1)); done'

[[observe]]
kind    = "stdout"
snippet = ""
fixed   = "0\n"
