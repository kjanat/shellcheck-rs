#:schema ../../schemas/validity-spec.schema.json

code  = 3048
claim = "sh's trap rejects the SIG prefix: the signal keeps its default action and kills the shell"
shell = "sh"

[snippet]
script = "trap 'echo caught' SIGUSR1 2>/dev/null; kill -s USR1 $$; echo done"

[fixed]
script = "trap 'echo caught' USR1; kill -s USR1 $$; echo done"

[[observe]]
kind    = "stdout"
snippet = ""
fixed   = "caught\ndone\n"
