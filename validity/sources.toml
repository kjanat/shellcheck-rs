#:tombi toml-version = "v1.1.0"
# `cargo validity pin` resolves this file into matrix.toml.

[defaults]
base  = "debian:bookworm-slim"
parse = ["-n"]

[shell.bash]
kind     = "tarball"
url      = "https://ftp.gnu.org/gnu/bash/bash-{version}.tar.gz"
versions = ["3.2.57", "4.0", "4.2.53", "4.4.18", "5.0", "5.1.16", "5.2.37", "5.3"]
argv     = ["bash"]
shipped  = true
dialect  = "bash"

[shell.dash]
kind     = "tarball"
url      = "http://gondor.apana.org.au/~herbert/dash/files/dash-{version}.tar.gz"
versions = ["0.5.8", "0.5.9.1", "0.5.10.2", "0.5.11.5", "0.5.12", "0.5.13"]
argv     = ["dash"]
shipped  = true
dialect  = "sh"

[shell.ksh]
kind     = "git"
repo     = "https://github.com/ksh93/ksh"
tag      = "v{version}"
versions = ["1.0.0", "1.0.4", "1.0.8", "1.0.10"]
argv     = ["ksh"]
shipped  = true
dialect  = "ksh"

[shell.busybox]
kind     = "tarball"
url      = "https://busybox.net/downloads/busybox-{version}.tar.bz2"
versions = ["1.30.1", "1.31.1", "1.32.1", "1.33.2", "1.34.1", "1.35.0", "1.36.1", "1.37.0"]
argv     = ["busybox", "sh"]
shipped  = true
dialect  = "busybox"

[shell.zsh]
kind     = "tarball"
url      = "https://www.zsh.org/pub/old/zsh-{version}.tar.xz"
versions = ["5.8.1", "5.9"]
argv     = ["zsh"]

[shell.zsh-sh]
image    = "zsh"
kind     = "tarball"
url      = "https://www.zsh.org/pub/old/zsh-{version}.tar.xz"
versions = ["5.8.1", "5.9"]
argv     = ["zsh", "--emulate", "sh"]
dialect  = "sh"

[shell.mksh]
kind     = "tarball"
url      = "https://mbsd.evolvis.org/MirOS/dist/mir/mksh/mksh-{version}.tgz"
versions = ["R59c"]
argv     = ["mksh"]

[shell.oksh]
kind     = "git"
repo     = "https://github.com/ibara/oksh"
tag      = "oksh-{version}"
versions = ["7.9"]
argv     = ["oksh"]

[shell.loksh]
kind     = "git"
repo     = "https://github.com/dimkr/loksh"
tag      = "{version}"
versions = ["7.9"]
argv     = ["loksh"]

[shell.yash]
kind     = "git"
repo     = "https://github.com/magicant/yash"
tag      = "{version}"
versions = ["2.59"]
argv     = ["yash"]

[shell.posh]
kind     = "tarball"
url      = "https://deb.debian.org/debian/pool/main/p/posh/posh_{version}.tar.xz"
versions = ["0.14.1"]
argv     = ["posh"]

[shell.osh]
kind     = "tarball"
url      = "https://oils.pub/download/oils-for-unix-{version}.tar.gz"
versions = ["0.38.0"]
argv     = ["osh"]

[shell.brush]
kind     = "crate"
base     = "rust:1-slim-bookworm"
versions = ["0.4.0"]
argv     = ["brush"]

[shell.bosh]
kind     = "git"
repo     = "https://codeberg.org/schilytools/schilytools"
tag      = "{version}"
versions = ["2024-03-21"]
argv     = ["bosh"]

[shell.freebsd-sh]
kind     = "image"
url      = "https://download.freebsd.org/releases/VM-IMAGES/{version}-RELEASE/amd64/Latest/FreeBSD-{version}-RELEASE-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz"
versions = ["14.5", "15.1"]
argv     = ["sh"]
vm       = true

[shell.netbsd-sh]
kind     = "image"
url      = "https://cdn.netbsd.org/pub/NetBSD/NetBSD-{version}/images/NetBSD-{version}-amd64-live.img.gz"
versions = ["10.2", "11.0"]
argv     = ["sh"]
vm       = true

[shell.tcsh]
kind     = "tarball"
url      = "https://astron.com/pub/tcsh/tcsh-{version}.tar.gz"
versions = ["6.24.16"]
argv     = ["tcsh", "-f"]
