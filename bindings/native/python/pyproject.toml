[project]
name            = "rshellcheck"
version         = "1.0.0"
description     = "Native Rust ShellCheck command-line tool"
readme          = "README.md"
requires-python = ">=3.12"
license         = "GPL-3.0-or-later"
dependencies    = []

[project.urls]
Issues     = "https://github.com/kjanat/shellcheck-rs/issues"
Repository = "https://github.com/kjanat/shellcheck-rs"

[project.scripts]
rshellcheck = "rshellcheck:main"

[build-system]
requires      = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.setuptools]
packages = ["rshellcheck"]
