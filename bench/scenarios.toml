# What each candidate is timed on. Paths are relative to the corpus directory
# (.bench/corpus, generated by bench/corpus.py); globs are expanded by the
# runner so every candidate sees the identical argument list.
#
# `-f gcc` keeps output formatting cheap so the time is dominated by parsing
# and analysis; the json1 scenario adds the serialisation cost on top.

[scenarios.startup]
description = "Process start-up and teardown on a two-line script"
args        = ["-f", "gcc", "startup.sh"]

[scenarios.small]
description = "A typical ~150-line script"
args        = ["-f", "gcc", "small.sh"]

[scenarios.medium]
description = "A ~1500-line script"
args        = ["-f", "gcc", "medium.sh"]

[scenarios.large]
description = "A ~4000-line script"
args        = ["-f", "gcc", "large.sh"]

[scenarios.large-json1]
description = "The large script with json1 output (formatter cost included)"
args        = ["-f", "json1", "large.sh"]

[scenarios.many]
description = "120 small scripts checked in one invocation"
args        = ["-f", "gcc", "many/*.sh"]
