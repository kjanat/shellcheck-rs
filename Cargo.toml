[workspace]
resolver = "3"
members  = ["compiler/rust/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
h2r-analysis = { path = "compiler/rust/crates/h2r-analysis" }
h2r-core-ir  = { path = "compiler/rust/crates/h2r-core-ir" }
h2r-lower    = { path = "compiler/rust/crates/h2r-lower" }
h2r-rt       = { path = "compiler/rust/crates/h2r-rt" }
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1", features = ["unbounded_depth"] }
sha2         = "0.10"
walkdir      = "2"

[workspace.lints.clippy]
let_underscore_must_use            = "warn"
map_err_ignore                     = "warn"
match_wildcard_for_single_variants = "warn"
unused_result_ok                   = "warn"
