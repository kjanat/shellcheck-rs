[workspace]
resolver = "3"
members = ["crates/shellcheck-rs", "crates/shellcheck-cli", "crates/conformance"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
shellcheck-rs = { path = "crates/shellcheck-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
