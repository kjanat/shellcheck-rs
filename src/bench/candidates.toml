[candidates.upstream-release]
binary = "shellcheck"
tool   = "shellcheck"

[candidates.upstream-head]
baseline = true
repo     = "https://github.com/koalaman/shellcheck.git"
ref      = "master"
build    = "cabal"
package  = "ShellCheck"
binary   = "shellcheck"
release  = "upstream-release"
tools    = ["ghcup", "ghc", "cabal"]

[candidates.rshellcheck]
repo    = "https://github.com/kjanat/shellcheck-rs.git"
ref     = "master"
package = "shellcheck-cli"
tools   = ["rust"]

[candidates.h2r]
repo    = "https://github.com/kjanat/shellcheck-rs.git"
ref     = "h2r-compiler"
package = "rshellcheck"
tools   = ["ghcup", "ghc", "cabal", "rust"]
