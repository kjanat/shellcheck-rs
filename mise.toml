#:schema https://mise.jdx.dev/schema/mise.json
# Benchmark tools. Candidate locks take precedence over the harness build toolchain.

min_version = "2026.10.0"

[tools]
hyperfine  = "1.20.0"
python     = "3.14"
rust       = "latest"
shellcheck = "latest"
uv         = "0.12.23"
runner-run = "0.27.1"

[tool_alias]
shellcheck = "github:koalaman/shellcheck"
runner-run = "github:kjanat/runner"

[settings]
lockfile                            = true
minimum_release_age                 = "0s"
python.uv_venv_auto                 = "create|source"
idiomatic_version_file_enable_tools = ["python"]

[env]
UV_LINK_MODE = "copy"

[tasks.bench]
description = "Prepare candidates, measure workloads, and report"
run         = "uv run bench {{arg(name='args', var=true)}}"

[tasks."bench:prepare"]
description = "Reuse prepared binaries or build candidates at exact revisions"
run         = "uv run bench prepare {{arg(name='args', var=true)}}"

[tasks."bench:run"]
description = "Measure prepared binaries without compiling"
run         = "uv run bench run {{arg(name='args', var=true)}}"

[tasks."bench:report"]
description = "Rebuild a compact report from an existing run"
run         = "uv run bench report {{arg(name='args', var=true)}}"

[tasks."bench:corpus"]
description = "Generate deterministic workloads"
run         = "uv run bench corpus --out .bench/corpus {{arg(name='args', var=true)}}"

[tasks."bench:selftest"]
description = "Check statistics, memory accounting, and report reproducibility"
run         = "uv run python -m unittest discover -s tests -p test_memory.py -v"

[tasks.test]
description = "Verify preparation, measurement, and reporting contracts"
run         = "uv run python -m unittest discover -s tests -v"

[tasks.check]
description = "Check Python, configuration, and CI"
run         = ["uv run ruff check src tests", "uv run ty check", "actionlint .github/workflows/bench.yml", "dprint check"]
