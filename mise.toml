#:schema https://mise.jdx.dev/schema/mise.json
# Project toolchain, managed by mise (https://mise.jdx.dev).
#
# H2R is a mixed Haskell/Rust compiler pipeline:
# - GHC 9.6.7 is the frontend and the format-6 Core dump contract.
# - Cabal builds the ShellCheck oracle and h2r-plugin.
# - Rust builds the analyses, lowering passes, runtime, and CLI.
#
# Fuzzy tool versions are resolved through mise.lock. GHC is pinned exactly:
# the post-CoreTidy alignment and IdInfo join are proved against GHC 9.6.7.

min_version = "2026.9.7"

[tools]
cabal  = { version = "latest" }
dprint = { version = "latest" }
# hls = {version = "latest"}
ghc    = { version = "9.6.7" }
ghcup  = { version = "latest", postinstall = "mise run hls-install" }
rust   = { version = "latest", components = ["rustfmt", "clippy"] }
tombi  = { version = "latest" }

[tool_alias]
ghc = "mise-ghcup:ghc"

[plugins]
"vfox-backend:mise-ghcup" = "https://github.com/wasp-lang/mise-ghcup.git"

[settings]
experimental = true
lockfile     = true

# -----------------------------------------------------------------------------
# Source checks
# -----------------------------------------------------------------------------

[tasks.fmt]
alias       = "f"
description = "Format with dprint"
run         = "dprint fmt"

[tasks.lint]
alias       = "l"
description = "Lint Rust and TOML"
run         = [
  "cargo clippy --manifest-path compiler/rust/Cargo.toml --workspace --all-targets -- -D warnings",
  "tombi lint --error-on-warnings mise.toml compiler/rust/Cargo.toml compiler/rust/crates/*/Cargo.toml",
  "dprint check"
]

[tasks.test]
alias       = "t"
description = "Run the H2R Rust workspace tests"
run         = "cargo test --manifest-path compiler/rust/Cargo.toml --workspace"

[tasks."lower:leaf"]
description = "Lower and verify one live leaf: <dump-dir> --fn '<stable-name>'"
run         = "cargo run --release --locked --manifest-path compiler/rust/Cargo.toml --bin h2r -- lower --nir"

[tasks."lower:program"]
description = "Attempt verified NIR for all live bindings: <dump-dir>; fails on refusals"
run         = "cargo run --release --locked --manifest-path compiler/rust/Cargo.toml --bin h2r -- lower --nir"

[tasks."lower:coverage"]
description = "Refresh canonical Core and capture verified NIR coverage"
depends     = ["extract"]
run         = '''
set -eu
cargo build --release --locked --manifest-path compiler/rust/Cargo.toml --bin h2r
out="$PWD/compiler/build/coverage"
mkdir -p "$out"
for dump in compiler/core-json/*.core.json; do
  jq -e '.format == 6 and (.constructors | type == "array")' "$dump" >/dev/null
done
status=0
compiler/rust/target/release/h2r lower compiler/core-json --nir >"$out/nir.txt" 2>"$out/nir.stderr" || status=$?
if [ "$status" -ne 0 ]; then
  if [ "$status" -ne 1 ] || ! grep -Eq '^Error: NIR lowering incomplete: [0-9]+ live bindings refused$' "$out/nir.stderr"; then
    cat "$out/nir.stderr" >&2
    exit "$status"
  fi
fi
grep -E '^Live owners: [0-9]+ = [0-9]+ lowered \+ [0-9]+ refused; [0-9]+ dead skipped$' "$out/nir.txt"
sha256sum compiler/rust/target/release/h2r compiler/core-json/*.core.json >"$out/inputs.sha256"
(cd "$out" && sha256sum nir.txt nir.stderr >outputs.sha256)
'''

[tasks.plugin]
description = "Build the GHC Core-dump plugin"
dir         = "{{ config_root }}/compiler/h2r-plugin"
run         = "cabal build all"

[tasks."canary:extract"]
description = "Build the small Haskell oracle and regenerate its Core dumps"
dir         = "{{ config_root }}/compiler/canary"
run         = '''
set -eu
cabal build --offline --builddir=../build/canary/cabal h2r-canary
for optimization in O1 O0; do
  out=../build/canary
  set --
  if [ "$optimization" = O0 ]; then
    out="$out/unoptimized"
    set -- -fmax-simplifier-iterations=0
  fi
  mkdir -p "$out/oracle-build"
  cabal exec --builddir=../build/canary/cabal -- ghc --make Main.hs "-$optimization" "$@" -fno-worker-wrapper -fforce-recomp -package h2r-plugin -fplugin=H2R.CorePlugin -fplugin-opt="H2R.CorePlugin:outdir=$out/core" -odir "$out/oracle-build" -hidir "$out/oracle-build" -o "$out/oracle"
done
'''

[tasks.canary]
description = "Emit Rust from real Core, compile it, and compare with Haskell"
depends     = ["canary:extract"]
run         = '''
set -eu
cargo build --release --locked --manifest-path compiler/rust/Cargo.toml --bin h2r
cases=0
for profile in optimized unoptimized; do
out=compiler/build/canary
binary_entries='forward add subtractInt multiply composed chained shared eqInt neInt ltInt leInt gtInt geInt minimumInt selectInt nestedBranch operandBranches scrutineeBranch sharedBranch branchCall makeBox boxedSum boxedIgnore boxedChoose boxedRoundTrip boxedShared boxedStrictIgnore'
binary_entries="$binary_entries lazyArgument lazyLet lazyNested lazyUnused lazyBranch lazyStrictUse"
binary_entries="$binary_entries dataChoice dataPair dataNested dataDefault dataLazy dataStrict dataMaybe dataList dataCaseBinder"
binary_entries="$binary_entries localJoin recursiveList localLazy"
recursive_entries='recursiveSum mutualRecursion localLoop localMutual'
if [ "$profile" = unoptimized ]; then
  out="$out/unoptimized"
fi
oracle="$out/oracle"
for entry in constant boxedCaf $binary_entries $recursive_entries recursiveTree; do
  name=$(jq -er --arg entry "$entry" '[.binds[].pairs[].binder | select(.occ == $entry) | .name] | if length == 1 then .[0] else error("ambiguous entry") end' "$out/core/Canary.core.json")
  compiler/rust/target/release/h2r emit-rust "$out/core" --entry "$name" --output "$out/$entry.rs"
  if [ "$profile" = unoptimized ]; then
    case "$entry" in
      operandBranches|scrutineeBranch|sharedBranch|branchCall)
        compiler/rust/target/release/h2r lower "$out/core" --nir --fn "$name" > "$out/$entry.nir"
        if ! rg -q ' = evaluate b[0-9]+' "$out/$entry.nir"; then
          echo "$entry did not exercise non-tail region lowering" >&2
          exit 1
        fi
        ;;
      lazyArgument|lazyLet|lazyNested|lazyUnused|lazyBranch)
        compiler/rust/target/release/h2r lower "$out/core" --nir --fn "$name" > "$out/$entry.nir"
        if ! rg -q ' = delay b[0-9]+' "$out/$entry.nir"; then
          echo "$entry did not exercise thunk-region lowering" >&2
          exit 1
        fi
        case "$entry" in
          lazyLet|lazyNested)
            if ! rg -q ', LazyBinding\]' "$out/$entry.nir"; then
              echo "$entry did not exercise shared local binding lowering" >&2
              exit 1
            fi
            ;;
        esac
        ;;
    esac
  fi
  rustc --edition=2024 -O "$out/$entry.rs" -o "$out/$entry"
  rustc --edition=2024 -C overflow-checks=yes "$out/$entry.rs" -o "$out/$entry-checked"
done
if [ "$profile" = unoptimized ]; then
  for spec in chooseData:construct readData:match-data readNested:match-data readMaybe:match-data listFirst:match-data; do
    entry=${spec%:*}
    operation=${spec#*:}
    name=$(jq -er --arg entry "$entry" '[.binds[].pairs[].binder | select(.occ == $entry) | .name] | if length == 1 then .[0] else error("ambiguous entry") end' "$out/core/Canary.core.json")
    compiler/rust/target/release/h2r lower "$out/core" --nir --fn "$name" > "$out/$entry.nir"
    if ! rg -q " = $operation " "$out/$entry.nir"; then
      echo "$entry did not exercise algebraic $operation lowering" >&2
      exit 1
    fi
  done
fi
for x in -1 0 1 2 7; do
  "$oracle" recursiveTree "$x" 23 > "$out/oracle.stdout" 2> "$out/oracle.stderr"
  for mode in '' '-checked'; do
    "$out/recursiveTree$mode" "$x" 23 > "$out/rust.stdout" 2> "$out/rust.stderr"
    cmp "$out/oracle.stdout" "$out/rust.stdout"
    cmp "$out/oracle.stderr" "$out/rust.stderr"
    cases=$((cases + 1))
  done
done
for entry in $recursive_entries; do
  name=$(jq -er --arg entry "$entry" '.binds[].pairs[].binder | select(.occ == $entry) | .name' "$out/core/Canary.core.json")
  compiler/rust/target/release/h2r lower "$out/core" --nir --fn "$name" > "$out/$entry.nir"
  case "$entry" in
    localLoop|localMutual)
      rg -q ' = local-scope ' "$out/$entry.nir"
      rg -q ' = call-local ' "$out/$entry.nir"
      ;;
  esac
  for x in -1 0 1 2 7 100; do
    for y in -17 0 23; do
      "$oracle" "$entry" "$x" "$y" > "$out/oracle.stdout" 2> "$out/oracle.stderr"
      for mode in '' '-checked'; do
        "$out/$entry$mode" "$x" "$y" > "$out/rust.stdout" 2> "$out/rust.stderr"
        cmp "$out/oracle.stdout" "$out/rust.stdout"
        cmp "$out/oracle.stderr" "$out/rust.stderr"
        cases=$((cases + 1))
      done
    done
  done
  "$oracle" "$entry" 1000000 1 > "$out/oracle.stdout" 2> "$out/oracle.stderr"
  for mode in '' '-checked'; do
    "$out/$entry$mode" 1000000 1 > "$out/rust.stdout" 2> "$out/rust.stderr"
    cmp "$out/oracle.stdout" "$out/rust.stdout"
    cmp "$out/oracle.stderr" "$out/rust.stderr"
    cases=$((cases + 1))
  done
done
before=$(sha256sum "$out/forward.rs")
if compiler/rust/target/release/h2r emit-rust "$out/core" --entry '$main$Main$main' --output "$out/forward.rs" 2> "$out/refusal.stderr"; then
  echo "unsupported IO entry was incorrectly emitted" >&2
  exit 1
fi
test "$before" = "$(sha256sum "$out/forward.rs")"
H2R_CANARY_DIR="$PWD/$out" rustc --edition=2024 --test compiler/canary/boxed_checks.rs -o "$out/boxed-checks"
"$out/boxed-checks"
"$oracle" boxedCaf > "$out/oracle.stdout" 2> "$out/oracle.stderr"
for mode in '' '-checked'; do
  "$out/boxedCaf$mode" > "$out/rust.stdout" 2> "$out/rust.stderr"
  cmp "$out/oracle.stdout" "$out/rust.stdout"
  cmp "$out/oracle.stderr" "$out/rust.stderr"
  cases=$((cases + 1))
done
for x in -9223372036854775808 -100 -1 0 1 42 9223372036854775807; do
  "$oracle" constant "$x" > "$out/oracle.stdout" 2> "$out/oracle.stderr"
  for mode in '' '-checked'; do
    "$out/constant$mode" "$x" > "$out/rust.stdout" 2> "$out/rust.stderr"
    cmp "$out/oracle.stdout" "$out/rust.stdout"
    cmp "$out/oracle.stderr" "$out/rust.stderr"
    cases=$((cases + 1))
  done
  for y in -9223372036854775808 -17 -1 0 1 23 9223372036854775807; do
    for entry in $binary_entries; do
      "$oracle" "$entry" "$x" "$y" > "$out/oracle.stdout" 2> "$out/oracle.stderr"
      for mode in '' '-checked'; do
        "$out/$entry$mode" "$x" "$y" > "$out/rust.stdout" 2> "$out/rust.stderr"
        cmp "$out/oracle.stdout" "$out/rust.stdout"
        cmp "$out/oracle.stderr" "$out/rust.stderr"
        cases=$((cases + 1))
      done
    done
  done
done
done
printf '%s differential cases passed (stdout, stderr, successful exit).\n' "$cases"
'''

[tasks.check]
alias       = "c"
description = "H2R source gate: format, lint, tests, and plugin build"
run         = [
  "cargo fmt --manifest-path compiler/rust/Cargo.toml --all -- --check",
  "cargo clippy --manifest-path compiler/rust/Cargo.toml --workspace --all-targets -- -D warnings",
  "cargo test --manifest-path compiler/rust/Cargo.toml --workspace",
  "mise run plugin",
]

# -----------------------------------------------------------------------------
# Haskell oracle
# -----------------------------------------------------------------------------

[tasks.oracle]
description = "Build and test upstream ShellCheck with the canonical GHC"
run         = "cabal test"

[tasks."conformance:corpus"]
description = "Report extracted upstream properties and coverage gaps"
run         = "cargo run --release --manifest-path compiler/rust/Cargo.toml -p h2r-conformance -- corpus"

[tasks.conformance]
description = "Compare --candidate with the Haskell oracle on upstream properties"
run         = "cargo run --release --manifest-path compiler/rust/Cargo.toml -p h2r-conformance -- gate"

[tasks."conformance:fuzz"]
description = "Seeded differential fuzzing of --candidate against the Haskell oracle"
run         = "cargo run --release --manifest-path compiler/rust/Cargo.toml -p h2r-conformance -- fuzz"

[tasks.hls-install]
confirm     = "Do you want to install the hls language server"
description = "install hls in non-ci environments"
file        = "scripts/hls.sh"

# -----------------------------------------------------------------------------
# Core extraction
# -----------------------------------------------------------------------------

[tasks.extract]
alias             = "x"
description       = "Extract canonical -O1 format-6 Core into compiler/core-json"
env.H2R_BUILD_DIR = "{{ config_root }}/compiler/build/canonical"
file              = "compiler/extract.sh"

[tasks.matrix]
description = "Extract the GHC optimization matrix; optional profile names are forwarded"
file        = "compiler/matrix.sh"

[tasks."baseline:historical"]
description        = "Reconstruct canonical format-5 Core at the corrected M2.4 checkpoint"
env.H2R_SOURCE_REF = "aa5b7f3763ea6c95dc0412ac2bbae6fddee6c487"
env.H2R_BUILD_DIR  = "{{ config_root }}/compiler/matrix/format5/build"
env.H2R_CORE_DIR   = "{{ config_root }}/compiler/matrix/format5/core-json"
env.H2R_KEEP_DIR   = "{{ config_root }}/compiler/matrix/format5"
env.H2R_PLAN       = "{{ config_root }}/compiler/matrix/A/plan.json"
env.H2R_OPT        = "-O1"
file               = "compiler/extract.sh"

[tasks.baseline]
description = "Extract and verify the canonical dump and all six optimization profiles"
run         = [
  { task = "extract" },
  { task = "matrix" },
  { task = "baseline:reports" },
]

[tasks."baseline:reports"]
description = "Capture and verify analysis reports for the seven existing dumps"
run         = '''
set -eu
cargo build --release --locked --manifest-path compiler/rust/Cargo.toml --bin h2r
bin="$PWD/compiler/rust/target/release/h2r"
for profile in canonical A B C D E F; do
  dir="$PWD/compiler/matrix/$profile/core-json"
  [ "$profile" != canonical ] || dir="$PWD/compiler/core-json"
  out="$PWD/compiler/matrix/$profile/reports"
  test -f "$dir/Main.core.json"
  mkdir -p "$out"
  fingerprint=$({ sha256sum "$bin" mise.toml; find "$dir" -name '*.core.json' -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum)
  if [ -f "$out/inputs.sha256" ] && [ "$(cat "$out/inputs.sha256")" = "$fingerprint" ] &&
      (cd "$out" && sha256sum --check --status reports.sha256); then
    echo "$profile: verified reports unchanged"
    continue
  fi
  "$bin" stats "$dir" --per-module >"$out/stats.txt"
  for command in laziness parsec tuples fields lists text classops dictflow higher verify-rep verify-m24 m24; do
    "$bin" "$command" "$dir" >"$out/$command.txt"
    "$bin" "$command" "$dir" --json >"$out/$command.json"
  done
  "$bin" tuples "$dir" --verify >"$out/verify-tuples.txt"
  "$bin" tuples "$dir" --boundaries >"$out/boundaries.txt"
  "$bin" lower "$dir" --reachability --m24-link >"$out/reachability.txt"
  "$bin" lower "$dir" --reachability --json >"$out/reachability.json"
  grep -Eq '^dump format +6 ' "$out/stats.txt"
  grep -Eq '^modules +28$' "$out/stats.txt"
  for report in verify-tuples verify-rep verify-m24; do
    grep -Eq '^ +DISAGREEMENTS.* +0$' "$out/$report.txt"
  done
  grep -Fq 'A5-IN-WORLD-MISSING 0: the dead set is unconditional' "$out/reachability.txt"
  grep -Eq '^ +0 disagreements over [0-9]+ claims:' "$out/reachability.txt"
  (cd "$out" && sha256sum -- *.txt *.json >reports.sha256)
  printf '%s\n' "$fingerprint" >"$out/inputs.sha256"
  echo "$profile: reports captured and verification passed"
done
'''

[tasks."baseline:historical-reports"]
description = "Verify and capture the reconstructed canonical format-5 baseline"
run         = '''
set -eu
bin="$PWD/compiler/rust/target/release/h2r"
dir="$PWD/compiler/matrix/format5/core-json"
out="$PWD/compiler/matrix/format5/reports"
test -x "$bin"
test -f "$dir/Main.core.json"
mkdir -p "$out"
fingerprint=$({ sha256sum "$bin"; find "$dir" -name '*.core.json' -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum)
if [ -f "$out/inputs.sha256" ] && [ "$(cat "$out/inputs.sha256")" = "$fingerprint" ] &&
    (cd "$out" && sha256sum --check --status reports.sha256); then
  echo "format5: verified reports unchanged"
  exit 0
fi
"$bin" stats "$dir" --per-module >"$out/stats.txt"
for command in laziness higher dictflow; do
  "$bin" "$command" "$dir" --explain >"$out/$command.txt"
  "$bin" "$command" "$dir" --explain --json >"$out/$command.json"
done
for command in m24 verify-m24; do
  "$bin" "$command" "$dir" >"$out/$command.txt"
  "$bin" "$command" "$dir" --json >"$out/$command.json"
done
"$bin" lower "$dir" --reachability --json >"$out/reachability.json"
grep -Eq '^dump format +5 ' "$out/stats.txt"
grep -Eq '^modules +28$' "$out/stats.txt"
grep -Eq '^ +DISAGREEMENTS.* +0$' "$out/verify-m24.txt"
(cd "$out" && sha256sum -- *.txt *.json >reports.sha256)
printf '%s\n' "$fingerprint" >"$out/inputs.sha256"
echo "format5: reports captured and verification passed"
'''

[tasks."baseline:explain"]
description = "Capture reusable gate-8 explanations from existing dumps (default: canonical)"
run         = '''
set -eu
bin="$PWD/compiler/rust/target/release/h2r"
test -x "$bin"
[ "$#" -gt 0 ] || set -- canonical
for profile in "$@"; do
  case "$profile" in canonical|A|B|C|D|E|F) ;; *) echo "Unknown profile: $profile" >&2; exit 1 ;; esac
  dir="$PWD/compiler/matrix/$profile/core-json"
  [ "$profile" != canonical ] || dir="$PWD/compiler/core-json"
  test -f "$dir/Main.core.json"
  out="$PWD/compiler/matrix/$profile/explain"
  mkdir -p "$out"
  fingerprint=$({ sha256sum "$bin"; find "$dir" -name '*.core.json' -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum)
  for command in dictflow higher higher-plans parsec traverse-reachability path-link; do
    report="$command.txt"
    [ "$command" != higher-plans ] || report="$command.json"
    if [ -f "$out/$command.inputs" ] && [ "$(cat "$out/$command.inputs")" = "$fingerprint" ] &&
        (cd "$out" && sha256sum --check --status "$command.sha256"); then
      echo "$profile: $command explanation unchanged"
      continue
    fi
    if [ "$command" = higher-plans ]; then
      "$bin" higher "$dir" --explain --json >"$out/$report"
    elif [ "$command" = path-link ]; then
      "$bin" lower "$dir" --reachability --link '$ShellCheck-0.11.0-inplace$ShellCheck.ASTLib$$wgetPath' >"$out/$report"
    elif [ "$command" = traverse-reachability ]; then
      "$bin" lower "$dir" --reachability --explain '$ShellCheck-0.11.0-inplace$ShellCheck.AST$$fTraversableInnerToken_$ctraverse' >"$out/$report"
    else
      "$bin" "$command" "$dir" --explain >"$out/$report"
    fi
    (cd "$out" && sha256sum "$report" >"$command.sha256")
    printf '%s\n' "$fingerprint" >"$out/$command.inputs"
    echo "$profile: $command explanation captured"
  done
done
'''

# Examples:
#   mise run matrix C
#   mise run matrix A B C

# -----------------------------------------------------------------------------
# H2R CLI and proof gates
# -----------------------------------------------------------------------------

[tasks.h2r]
alias       = "h"
description = "Run the H2R CLI; arguments are forwarded after `--`"
dir         = "compiler/rust"
run         = "cargo run --release --bin h2r --"

# Examples:
#   mise run h2r stats ../core-json
#   mise run h2r laziness ../core-json
#   mise run h2r lower ../core-json --reachability

[tasks.proofs]
alias       = "p"
description = "Run the independent proof verifiers on the canonical dump"
run         = [
  "cargo run --release --manifest-path compiler/rust/Cargo.toml --bin h2r -- tuples compiler/core-json --verify",
  "cargo run --release --manifest-path compiler/rust/Cargo.toml --bin h2r -- verify-rep compiler/core-json",
  "cargo run --release --manifest-path compiler/rust/Cargo.toml --bin h2r -- verify-m24 compiler/core-json",
  "cargo run --release --manifest-path compiler/rust/Cargo.toml --bin h2r -- lower compiler/core-json --reachability",
]

[tasks.full]
description = "Run source checks and the upstream ShellCheck oracle"
run         = [
  { task = "check" },
  { task = "oracle" },
]
