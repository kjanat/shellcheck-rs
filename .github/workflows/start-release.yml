name: Start release
on:
  workflow_dispatch:
    inputs:
      stream:
        description: Release stream
        type: choice
        options:
          - rshellcheck
        default: rshellcheck
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: Semantic version; replaces the bump when set
        type: string
permissions: {}
jobs:
  start:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: kjanat/beepboop/actions/release@v1
        with:
          stream: ${{ inputs.stream }}
          version: ${{ inputs.version || inputs.bump }}
