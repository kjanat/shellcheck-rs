name: Bench

# Compares koalaman's latest ShellCheck release with this repository's
# `rust-port` and `h2r-compiler` branches. See bench/README.md.
#
# Layout: `resolve` pins every candidate to a commit/version and derives its
# content key; one `build` job per candidate restores the finished binary from
# the Actions cache under that key and only builds on a miss (the h2r pipeline
# takes an hour or more; its intermediate layers are cached too, so even a
# miss is cheaper the second time); `bench` then downloads the three binaries
# and times them on one runner, in one job, so the numbers are comparable.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Interleaved rounds (candidate order is re-shuffled each round)
        default: "5"
      runs:
        description: Timed runs per candidate per round
        default: "10"
      warmup:
        description: Warm-up runs per candidate per round
        default: "3"
      scenarios:
        description: Comma-separated scenario subset (empty = all)
        default: ""
  push:
    branches: [bench]
    paths:
      - bench/**
      - "!bench/results/**" # archived reports do not need re-measuring
      - mise.toml
      - mise.lock
      - .github/workflows/bench.yml

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_YES: "1"
  # bench/build.sh trusts the candidate worktrees itself; the root config is ours.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  resolve:
    name: Resolve candidates
    runs-on: ubuntu-latest
    outputs: { candidates: "${{ steps.resolve.outputs.candidates }}" }
    steps:
      - uses: &CheckOut actions/checkout@v7
      - uses: &Mise jdx/mise-action@v5
        with: { install_args: uv }
      - name: Resolve refs and cache keys
        id: resolve
        run: ./bench/build.sh resolve

  build:
    name: Build ${{ matrix.candidate }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy: { fail-fast: false, matrix: { candidate: [upstream, rust-port, h2r] } }
    env:
      PIN: ${{ fromJSON(needs.resolve.outputs.candidates)[matrix.candidate].pin }}
      KEY: ${{ fromJSON(needs.resolve.outputs.candidates)[matrix.candidate].key }}
      bench_bin_path: .bench/bin
    steps:
      - uses: *CheckOut

      # Fast path: the finished binary for exactly this commit/version.
      - name: Restore built binary
        id: bin
        uses: &RestoreCache actions/cache/restore@v6
        with: &CandidateCache
          path: ${{ env.bench_bin_path }}/${{ matrix.candidate }}
          key: bench-bin-${{ matrix.candidate }}-${{ env.KEY }}

      - parallel:
          - name: Check out ${{ matrix.candidate }} @ ${{ env.PIN }}
            if: steps.bin.outputs.cache-hit != 'true' && matrix.candidate != 'upstream'
            uses: *CheckOut
            with:
              ref: ${{ env.PIN }}
              path: .bench/src/${{ matrix.candidate }}

          - name: System libraries for GHC
            if: steps.bin.outputs.cache-hit != 'true' && matrix.candidate == 'h2r'
            run: sudo apt-get update -qq && sudo apt-get install -y -qq libgmp-dev libnuma-dev zlib1g-dev pkg-config

      - name: Install root toolchain (mise)
        if: &NoCache steps.bin.outputs.cache-hit != 'true'
        uses: *Mise
        with: { cache: false }

      # Slow path helpers: intermediate layers so a rebuild after a branch push
      # is incremental. restore-keys fall back to the newest cache for the
      # candidate when the exact commit changed.
      - name: Restore toolchains and build layers
        if: *NoCache
        id: layers
        uses: *RestoreCache
        with:
          path: &ToolChainCachePaths |
            ~/.local/share/mise/installs
            ~/.local/share/mise/plugins
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.cache/cabal
            ~/.local/state/cabal
            .bench/target/${{ matrix.candidate }}
          key: bench-layers-${{ matrix.candidate }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', format('.bench/src/{0}/mise.lock', matrix.candidate), format('.bench/src/{0}/Cargo.lock', matrix.candidate)) }}-${{ env.PIN }}
          restore-keys: |
            bench-layers-${{ matrix.candidate }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', format('.bench/src/{0}/mise.lock', matrix.candidate), format('.bench/src/{0}/Cargo.lock', matrix.candidate)) }}-
            bench-layers-${{ matrix.candidate }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ${{ matrix.candidate }}
        if: *NoCache
        env:
          # actions/checkout put the source in place; make build.sh use that exact commit.
          BENCH_SHA_RUST_PORT: ${{ matrix.candidate == 'rust-port' && env.PIN || '' }}
          BENCH_SHA_H2R: ${{ matrix.candidate == 'h2r' && env.PIN || '' }}
          candidate: ${{ matrix.candidate }}
        run: |
          ./bench/build.sh build "${candidate}"
          built_key="$(bench/build.sh key "${candidate}")"
          test "${built_key}" = "${KEY}" || { echo "::error::cache key drifted between resolve and build"; exit 1; }
          cat "${bench_bin_path}/${candidate}/manifest.json"

      - name: Save built binary
        if: *NoCache
        uses: &SaveCache actions/cache/save@v6
        with: *CandidateCache

      - name: Save toolchains and build layers
        if: steps.bin.outputs.cache-hit != 'true' && steps.layers.outputs.cache-hit != 'true'
        uses: *SaveCache
        with:
          path: *ToolChainCachePaths
          key: ${{ steps.layers.outputs.cache-primary-key }}

      - uses: &Upload actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.candidate }}
          path: "${{ env.bench_bin_path }}/${{ matrix.candidate }}"
          if-no-files-found: error
          retention-days: 30

  bench:
    name: Benchmark
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: { bench_results_path: .bench/results/ci }
    steps:
      - uses: *CheckOut
      - uses: *Mise

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: &BinPath .bench/bin

      - name: Arrange binaries
        shell: "/bin/bash -eu {0}"
        env: { bin_path: *BinPath }
        run: |
          for d in "${bin_path}/bin-"*; do mv "${d}" "${bin_path}/${d##*/bin-}"; done
          chmod +x "${bin_path}"/*/shellcheck
          for m in "${bin_path}"/*/manifest.json; do
            printf '%s: ' "$(dirname "${m}")"; jq -r '"\(.name) \(.pin) key \(.key) sha256 \(.binary_sha256)"' "${m}"
          done

      - name: Generate corpus
        run: mise run bench:corpus

      - name: Run
        env:
          ROUNDS: ${{ inputs.rounds || '5' }}
          RUNS: ${{ inputs.runs || '10' }}
          WARMUP: ${{ inputs.warmup || '3' }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: mise run bench:run --rounds "${ROUNDS}" --runs "${RUNS}" --warmup "${WARMUP}"
          ${SCENARIOS:+--scenarios "${SCENARIOS}"} --out "${bench_results_path}"

      - name: Analyze
        run: mise run bench:analyze "${bench_results_path}" >/dev/null;

      - name: Report
        run: tee /dev/stderr <"${bench_results_path}/report.md" >"${GITHUB_STEP_SUMMARY}"

      - uses: *Upload
        with:
          name: bench-results
          path: "${{ env.bench_results_path }}"
          retention-days: 90
