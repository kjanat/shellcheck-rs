name: Bench

on:
  workflow_dispatch:
    inputs:
      rounds: { description: Shuffled rounds, default: "5" }
      runs: { description: Timed runs per round, default: "4" }
      warmup: { description: Warm-ups per round, default: "1" }
      max_run_seconds: { description: Repeat only workloads below this many seconds; slower workloads retain a complete sweep, default: "30" }
      scenarios: { description: Comma-separated workload subset, default: "" }
  push:
    branches: [bench]
    paths: [src/**, tests/**, pyproject.toml, uv.lock, mise.toml, mise.lock, .github/workflows/bench.yml]
  pull_request:
    branches: [master]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".cargo/**", "mise.toml", "mise.bench.toml", ".github/workflows/bench.yml"]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: bench
  MISE_YES: "1"
  # Python 3.15 `tomllib` reads the TOML 1.1 in `mise.toml`.
  UV_PYTHON: "3.15"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  resolve:
    name: Resolve exact candidate identities
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      candidates: ${{ steps.plan.outputs.candidates }}
      harness: ${{ steps.harness.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with: { install_args: "python uv github:koalaman/shellcheck" }
      - name: Pin the harness revision
        id: harness
        run: |
          read -r sha _ < <(git ls-remote origin refs/heads/bench)
          echo "harness=git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${sha}" >> "${GITHUB_OUTPUT}"
      - name: Compare the pull request with its base branch
        id: pr
        if: github.event_name == 'pull_request'
        env: { PR: "${{ github.event.pull_request.number }}", BASE: "${{ github.base_ref }}" }
        run: |
          mkdir -p .bench
          cat > .bench/pr-candidates.toml <<EOF
          [candidates.master]
          baseline = true
          repo     = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          ref      = "${BASE}"
          package  = "rshellcheck"
          tools    = ["rust"]
          judge    = "conformance"

          [candidates.pr]
          repo    = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          ref     = "refs/pull/${PR}/head"
          package = "rshellcheck"
          tools   = ["rust"]
          judge   = "conformance"

          [candidates.upstream-release]
          binary = "shellcheck"
          tool   = "shellcheck"
          EOF
          echo "config=.bench/pr-candidates.toml" >> "${GITHUB_OUTPUT}"
      - name: Prepare bench plan
        run: uvx --from "${HARNESS}" bench prepare --resolve-only --plan .bench/plan.json ${CONFIG:+--config "${CONFIG}"}
        env: { HARNESS: "${{ steps.harness.outputs.harness }}", CONFIG: "${{ steps.pr.outputs.config }}" }
      - name: Resolve once
        id: plan
        run: |
          jq -c '"candidates=" + ([.builds[] | {name, key, layers_key}
            + {build: (if (.source // "") != "" then .spec.build else "binary" end), cabal: (.spec.tools | index("cabal") != null)}] | tojson)' \
            -r .bench/plan.json >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        with: { name: candidate-plan, path: .bench/plan.json, include-hidden-files: true }

  prepare:
    name: Prepare ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.candidates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with: { install_args: "python uv github:koalaman/shellcheck" }
      - uses: actions/download-artifact@v8
        with: { name: candidate-plan, path: .bench }
      - name: Restore completed binary and provenance
        id: binary
        uses: actions/cache/restore@v6
        with: &BinaryCache
          path: .bench/cache/${{ matrix.name }}/${{ matrix.key }}
          key: bench-binary-${{ matrix.name }}-${{ matrix.key }}
      - name: Restore compatible build layers
        id: layers
        if: steps.binary.outputs.cache-hit != 'true' && matrix.build != 'binary'
        uses: actions/cache/restore@v6
        with:
          path: &BuildLayers |
            .bench/build/${{ matrix.name }}
            ~/.cache/cabal
            ~/.local/state/cabal
            ~/.local/share/mise/installs
            ~/.local/share/mise/plugins
            ~/.rustup/toolchains
          key: bench-layers-${{ matrix.name }}-${{ matrix.layers_key }}-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bench-layers-${{ matrix.name }}-${{ matrix.layers_key }}-
      - name: Restore Rust dependency downloads
        id: dependencies
        if: steps.binary.outputs.cache-hit != 'true' && matrix.build == 'cargo'
        uses: actions/cache/restore@v6
        with:
          path: .bench/dependencies/cargo
          key: bench-dependencies-${{ matrix.name }}-${{ matrix.layers_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bench-dependencies-${{ matrix.name }}-${{ matrix.layers_key }}-
      - name: Install GHC system libraries
        if: matrix.cabal
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgmp-dev libnuma-dev zlib1g-dev pkg-config
      - name: Prepare or verify cached binary
        run: uvx --from "${HARNESS}" bench prepare --plan .bench/plan.json --candidates "${CANDIDATE}"
        env: { CANDIDATE: "${{ matrix.name }}", HARNESS: "${{ needs.resolve.outputs.harness }}" }
      - name: Save completed binary
        if: ${{ steps.binary.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with: *BinaryCache
      - name: Preserve build layers, including recoverable partial builds
        if: ${{ !cancelled() && steps.layers.outcome == 'success' && steps.layers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: *BuildLayers
          key: ${{ steps.layers.outputs.cache-primary-key }}
      - name: Preserve downloaded dependencies
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .bench/dependencies/cargo
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-${{ matrix.name }}
          path: .bench/prepared/${{ matrix.name }}
          include-hidden-files: true

  measure:
    name: Measure all candidates together
    permissions: { contents: read, pull-requests: write }
    needs: [resolve, prepare]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env: { HARNESS: "${{ needs.resolve.outputs.harness }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with: { install_args: "python uv hyperfine node kprint" }
      - name: Install measurement runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq time libgmp10 libnuma1
      - uses: actions/download-artifact@v8
        with: { name: candidate-plan, path: .bench }
      - uses: actions/download-artifact@v8
        with: { pattern: prepared-*, path: .bench/artifacts }
      - name: Assemble and verify prepared artifacts
        run: |
          mkdir -p .bench/prepared
          for directory in .bench/artifacts/prepared-*; do mv "${directory}" ".bench/prepared/${directory##*/prepared-}"; done
          # Artifacts drop the executable bit of every published binary, the judge included.
          find .bench/prepared -mindepth 3 -maxdepth 3 -type f \( -name rshellcheck -o -name judge \) -exec chmod +x {} +
          uvx --from "${HARNESS}" bench prepare --verify --plan .bench/plan.json
      - name: Read the pinned Omarchy revision
        id: omarchy
        run: uvx --from "${HARNESS}" python -c 'from bench.omarchy import spec; print(f"pin={spec().pin}")' >> "${GITHUB_OUTPUT}"
      - name: Restore pinned Omarchy source
        uses: actions/cache@v6
        with:
          path: .bench/corpora/omarchy-source
          key: bench-corpus-omarchy-${{ runner.os }}-${{ steps.omarchy.outputs.pin }}
      - name: Generate synthetic and pinned Omarchy workloads
        run: uvx --from "${HARNESS}" bench corpus --omarchy --out .bench/corpus
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Measure
        env:
          ROUNDS: ${{ inputs.rounds || '5' }}
          RUNS: ${{ inputs.runs || '4' }}
          WARMUP: ${{ inputs.warmup || '1' }}
          MAX_RUN_SECONDS: ${{ inputs.max_run_seconds || (github.event_name == 'pull_request' && '5' || '30') }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: uvx --from "${HARNESS}" bench run --plan .bench/plan.json --rounds "${ROUNDS}" --runs "${RUNS}" --warmup "${WARMUP}" --max-run-seconds "${MAX_RUN_SECONDS}" --h2r-budget-seconds 600
          ${SCENARIOS:+--scenarios "${SCENARIOS}"} --out .bench/results/ci
      - name: Report
        run: uvx --from "${HARNESS}" bench report .bench/results/ci
      - uses: actions/upload-artifact@v7
        id: results
        if: ${{ !cancelled() }}
        with: { name: bench-results, path: .bench/results/ci, include-hidden-files: true, retention-days: 90 }
      - name: Publish summary with evidence download links
        shell: bash
        env: { ARTIFACT_URL: "${{ steps.results.outputs.artifact-url }}" }
        run: uvx --from "${HARNESS}" bench summary .bench/results/ci --artifact-url "${ARTIFACT_URL}" | kprint fmt --stdin md >> "${GITHUB_STEP_SUMMARY}"
      - name: Post the results on the pull request
        # A fork's token cannot write comments.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.results.outputs.artifact-url }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          start='<!-- rshellcheck-bench:start -->'
          end='<!-- rshellcheck-bench:end -->'
          results=.bench/results/ci
          {
            echo "${start}"
            jq -r --arg pr "${PR}" --slurpfile run "${results}/run.json" -f .github/scripts/bench-comment.jq "${results}/summary.json"
            echo "<details><summary>Full report</summary>"
            echo
            uvx --from "${HARNESS}" bench summary "${results}" --artifact-url "${ARTIFACT_URL}" | kprint fmt --stdin md
            echo
            echo "</details>"
            echo
            echo "<sub>[Bench run](${RUN_URL})</sub>"
            echo "${end}"
          } > "${RUNNER_TEMP}/section.md"
          # `--paginate` applies `--jq` to each page, so take the last id overall.
          comment=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- rshellcheck-bench"))) | .id' | tail -n 1)
          if [[ -z "${comment}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F "body=@${RUNNER_TEMP}/section.md" --jq .html_url
            exit
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" --jq .body > "${RUNNER_TEMP}/old.md"
          # Only the marked section changes, so text written around it survives.
          jq -nr --rawfile old "${RUNNER_TEMP}/old.md" --rawfile section "${RUNNER_TEMP}/section.md" --arg start "${start}" --arg end "${end}" '
            ($old | rtrimstr("\n")) as $old
            | ($section | rtrimstr("\n")) as $section
            | if ($old | contains($start)) and ($old | contains($end))
              then ($old | split($start)[0]) + $section + ($old | split($end)[1:] | join($end))
              else $section end
          ' > "${RUNNER_TEMP}/comment.md"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" -F "body=@${RUNNER_TEMP}/comment.md" --jq .html_url
