name: Mise tools

on:
  # Every pull request: the branch rulesets require this job, and a job that a
  # path filter skips never reports.
  pull_request: null

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  install:
    name: Install mise tools
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_YES: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 2 }

      - name: Detect tool changes
        id: changed
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(mise(\.[^/]+)?\.(toml|lock)|\.github/workflows/mise\.yml)$'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.changed.outputs.changed == 'true'
        with: { install: false }

      - name: Install the tools of every mise environment
        if: steps.changed.outputs.changed == 'true'
        run: |
          mise install
          for config in mise.*.toml; do
            [[ -e "${config}" ]] || continue
            environment="${config#mise.}"
            environment="${environment%.toml}"
            [[ "${environment}" == local ]] && continue
            mise install --env "${environment}"
          done
