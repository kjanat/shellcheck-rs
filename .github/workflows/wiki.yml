name: Publish wiki

# The `wiki` branch holds the GitHub wiki's pages (the same layout the wiki
# repository has: Home.md, _Sidebar.md, _Footer.md, the numbered page folders
# and tools/). Every push to that branch is mirrored into the wiki repository,
# so the wiki can be edited through ordinary branches, pull requests and
# sessions that have no access to <repo>.wiki.git.

on:
  push:
    branches: [wiki]
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: "${{ github.workflow }}", cancel-in-progress: false }

jobs:
  publish:
    name: Mirror the wiki branch into the wiki repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the wiki branch
        uses: actions/checkout@v5
        with:
          path: source

      - name: Clone the wiki repository
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Replace the wiki's content with the branch's
        run: |
          rsync --archive --delete \
            --exclude '.git' --exclude '.github' \
            source/ wiki/

      - name: Commit and push when anything changed
        working-directory: wiki
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "wiki already matches ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "Mirror wiki branch at ${GITHUB_SHA}"
          git push
