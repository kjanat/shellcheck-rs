name: Wiki

# This branch holds the GitHub wiki's pages in the wiki repository's own
# layout: Home.md, _Sidebar.md, _Footer.md, the numbered page folders and
# tools/. Every push to it is mirrored into `<repo>.wiki.git`, so the wiki is
# edited through ordinary branches and pull requests. The mirror is one way: a
# page edited in the wiki UI is overwritten by the next push here.

on:
  push: { branches: [wiki] }
  workflow_dispatch:

permissions: { contents: write }

concurrency: { group: wiki, cancel-in-progress: false }

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps: [uses: actions/checkout@v7, uses: kjanat/actionlint@v1]

  publish:
    name: Mirror into the wiki repository
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout the wiki branch
        uses: actions/checkout@v7
        with: { path: source }

      - name: Clone the wiki repository
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Replace the wiki's content with the branch's
        run: rsync --archive --delete --exclude .git --exclude .github source/ wiki/

      - name: Commit and push when anything changed
        working-directory: wiki
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "::notice::wiki already matches ${GITHUB_SHA}"
            exit 0
          fi
          git commit --message "Mirror wiki branch at ${GITHUB_SHA}"
          git push
