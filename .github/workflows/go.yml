name: Go installer

on:
  push:
    branches: [master]
    paths: &Paths ["go/**", ".github/workflows/go.yml"]
  pull_request: { paths: *Paths }

permissions: { contents: read }
concurrency:
  group: "go-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: { run: { shell: "bash -euo pipefail {0}", working-directory: go } }

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-26.04, macos-15, windows-2025] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: "go.mod", cache: false }
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then { printf '%s\n' "${unformatted}"; exit 1; }; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -v ./...
