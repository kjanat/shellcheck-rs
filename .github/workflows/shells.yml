name: Shell images and validity

on:
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch:
  push: { branches: [master, "!validity/*"] }
  pull_request:
    branches-ignore: ["validity/*"]
    paths:
      - ".github/workflows/shells.yml"
      - "docker/shells/**"
      - "validity/**"
      - "crates/conformance/**"
      - "tools/affected_shell_cells.py"
      - "tools/test_affected_shell_cells.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"

permissions: { contents: read }

jobs:
  pin:
    name: Pin sources
    if: github.event_name != 'pull_request' || github.head_ref != 'validity/drift'
    runs-on: ubuntu-latest
    concurrency:
      group: "${{ github.workflow }}-pin-${{ github.ref }}"
      queue: single
      cancel-in-progress: true
    outputs: { cells: "${{ steps.cells.outputs.cells }}" }
    steps:
      - name: Checkout repository
        uses: &CO actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }

      - name: Test affected-cell selection
        run: python3 -m unittest discover -s tools -p test_affected_shell_cells.py

      - name: Install Rust stable
        uses: &RUST dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Pin sources
        run: cargo validity pin

      - name: List cells
        id: cells
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "${PR_BASE}" ]]; then
            cells="$(python3 tools/affected_shell_cells.py --base "${PR_BASE}")"
          else
            cells="$(cargo validity cells)"
          fi
          echo "cells=${cells}" >> "${GITHUB_OUTPUT}"
          echo "Selected shell cells: ${cells}"

      - name: Upload matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: matrix, path: validity/matrix.toml }

  build:
    name: "Build ${{ matrix.cell }}"
    needs: pin
    if: needs.pin.outputs.cells != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: "${{ github.workflow }}-build-${{ github.ref }}-${{ matrix.cell }}"
      queue: single
      cancel-in-progress: true
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix: { cell: "${{ fromJSON(needs.pin.outputs.cells) }}" }
    steps:
      - name: Checkout repository
        uses: *CO

      - name: Install Rust stable
        uses: *RUST

      - name: Download matrix
        uses: &DL actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: matrix, path: validity }

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: &LOGIN docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }

      - name: Build image
        if: github.event_name == 'pull_request'
        run: cargo validity build --cell "${{ matrix.cell }}"

      - name: Build and push image
        id: push
        if: github.event_name != 'pull_request'
        run: cargo validity build --push --cell "${{ matrix.cell }}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: "${{ steps.push.outputs.repository }}"
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: false

      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: ${{ matrix.cell }}
        with:
          image: "${{ steps.push.outputs.repository }}@${{ steps.push.outputs.digest }}"
          format: spdx-json
          syft-version: v1.54.0
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest image SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@7d8b1cacecb65f487779b3b98fd5296a018d1a1b
        with:
          subject-name: "${{ steps.push.outputs.repository }}"
          subject-digest: "${{ steps.push.outputs.digest }}"
          sbom-path: image.spdx.json
          push-to-registry: false

  run:
    name: Run the matrix
    needs: [pin, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: "${{ github.workflow }}-matrix"
      queue: max
      cancel-in-progress: false
    permissions: { contents: write, pull-requests: write, packages: read }
    steps:
      - name: Checkout repository
        uses: *CO

      - name: Install Rust stable
        uses: *RUST

      - name: Download matrix
        uses: *DL
        with: { name: matrix, path: validity }

      - name: Log in to GHCR
        uses: *LOGIN
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }

      - name: Open /dev/kvm to every user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve image digests
        run: cargo validity pin

      - name: Record outcomes
        run: cargo validity --record

      - name: Open drift pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: validity/drift
          title: Record validity outcomes
          commit-message: Record validity outcomes
          body: |
            `cargo validity --record` on master changed the recorded matrix, outcomes or report. Review the rows that moved.
          add-paths: |
            validity/matrix.toml
            validity/outcomes.toml
            validity/REPORT.md
