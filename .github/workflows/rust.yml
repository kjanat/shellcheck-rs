name: Rust port conformance

# Separate from the Haskell-only build.yml. Runs only when the Rust port or
# this workflow change. The `conformance-gate` job is the required check: it
# builds the Haskell oracle and the Rust port from the same tree and compares
# them directly, with no committed baseline to drift.
on:
  # On a PR, the pull_request event already runs the gate on every commit, so
  # restrict push to the release branches to avoid running it twice per commit.
  push:
    branches: [master]
    paths: &PATHS
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "ShellCheck.cabal"
      - "src/**"
      - "shellcheck.hs"
  pull_request: { paths: *PATHS }

# Cancel an in-flight gate run when a newer commit is pushed to the same ref.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The rules the port is written under, enforced rather than remembered: every
  # file clippy-clean under `-D warnings`, and formatted. Separate from the gate
  # so a formatting slip does not hide behind a 10-minute oracle build.
  lint:
    name: Format, clippy, workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # rustfmt first: dprint formats .rs through an exec plugin that shells out
      # to it, so without the toolchain the check fails on tooling, not on code.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        uses: kjanat/dprint-check@v3

      - name: Clippy
        run: cargo lint

      # actionlint checks these workflows and hands every `run:` block to
      # shellcheck. The action runs a container with shellcheck and pyflakes in
      # it, so that half cannot silently skip the way it does when the CLI is
      # run somewhere shellcheck is not installed -- there it still exits 0.
      - name: Lint workflows
        uses: kjanat/actionlint@v1

  conformance-gate:
    name: Build oracle + port, run strict conformance gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # (a) Rust stable toolchain.
      - name: Install Rust stable
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        env:
          CACHE_PREFIX: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.cachekey }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.CACHE_PREFIX }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust/**/Cargo.toml', '.cargo/**', '.github/workflows/rust.yml') }}-${{ hashFiles('rust/crates/**') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust/**/Cargo.toml', '.cargo/**', '.github/workflows/rust.yml') }}-
            ${{ env.CACHE_PREFIX }}-

      # (b) Haskell oracle. The cached executable is looked up FIRST, keyed on
      #     the pinned GHC version and every Haskell input, so on a hit the GHC
      #     toolchain is not installed at all (that install alone is ~2 minutes
      #     of every run). Only an exact match may reuse the executable.
      - name: Cache Haskell oracle
        id: oracle
        uses: actions/cache@v6
        with:
          path: .cache/shellcheck-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-oracle-ghc9.6.6-${{ hashFiles('ShellCheck.cabal', 'cabal.project*', 'src/**', '*.hs', '.github/workflows/rust.yml') }}

      # Everything below runs only when the oracle must be (re)built.
      - name: Setup Haskell
        if: steps.oracle.outputs.cache-hit != 'true'
        id: haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.6"

      - name: Plan Haskell oracle build
        if: steps.oracle.outputs.cache-hit != 'true'
        run: cabal build shellcheck --dry-run

      - name: Cache Haskell build
        if: steps.oracle.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        env:
          CACHE_PREFIX: ${{ runner.os }}-${{ runner.arch }}-cabal-oracle-${{ steps.haskell.outputs.ghc-version }}-${{ steps.haskell.outputs.cabal-version }}
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.CACHE_PREFIX }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}-${{ hashFiles('ShellCheck.cabal', 'cabal.project*', 'src/**', '*.hs', '.github/workflows/rust.yml') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}-
            ${{ env.CACHE_PREFIX }}-

      - name: Build Haskell oracle
        if: steps.oracle.outputs.cache-hit != 'true'
        run: |
          cabal build shellcheck
          mkdir -p .cache
          ORACLE="$(cabal list-bin shellcheck)"
          cp "${ORACLE}" .cache/shellcheck-oracle

      # (c) Build + test the Rust port.
      - name: Build Rust port (release)
        working-directory: rust
        run: cargo build --release

      - name: Test shellcheck-rs
        working-directory: rust
        run: cargo test -p shellcheck-rs

      - name: Test shellcheck-cli
        working-directory: rust
        run: cargo test -p shellcheck-cli

      # (d) The required check: the script from every prop_ property that has
      #     one, run through both tools' full pipeline and compared on the whole
      #     json1 payload. The banner says how many properties have no script,
      #     so the part this does not cover stays visible.
      - name: Conformance gate
        run: cargo run --release -p conformance -- gate --repo . --oracle .cache/shellcheck-oracle

      # (e) Differential fuzzing over generated and mutated shell: the same
      #     comparison on input nobody wrote a test for. Allowed to fail; the
      #     count it prints is the parity number, and DIVERGENCES.md is where
      #     the open ones are written down.
      #
      #     --max-findings must stay well above that count: at the count, the
      #     run stops at the cap and a new divergence hides behind it.
      - name: Differential fuzz
        continue-on-error: true
        run: |
          cargo run --release -p conformance -- fuzz --repo . \
            --oracle .cache/shellcheck-oracle \
            --seed "${GITHUB_RUN_NUMBER}" --iterations 4000 --max-findings 50
