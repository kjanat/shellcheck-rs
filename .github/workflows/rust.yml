name: Rust port conformance

on:
  push:
    branches: [master]
    paths: &PATHS
      - "rust/**"
      - "**/Cargo.*"
      - ".cargo/**"
      - "mise.toml"
      - "mutants.toml"
      - ".github/workflows/rust.yml"
      - "ShellCheck.cabal"
      - "src/**"
      - "shellcheck.hs"
  pull_request: { paths: *PATHS }

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps: [uses: kjanat/actionlint@v1]

  lint:
    name: "Format, clippy, workflows"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }

      - name: Check formatting
        uses: kjanat/dprint-check@v3

      - name: Clippy
        run: cargo lint

  conformance-gate:
    name: Build and run gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        env:
          CACHE_PREFIX: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.cachekey }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.CACHE_PREFIX }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', '.github/workflows/rust.yml') }}-${{ hashFiles('rust/crates/**') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', '.github/workflows/rust.yml') }}-
            ${{ env.CACHE_PREFIX }}-

      - name: Cache Haskell oracle
        id: oracle
        uses: actions/cache@v6
        with:
          path: .cache/shellcheck-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-oracle-ghc9.6.6-${{ hashFiles('ShellCheck.cabal', 'cabal.project*', 'src/**', '*.hs', '.github/workflows/rust.yml') }}

      - name: Setup Haskell
        if: &NoCacheHit steps.oracle.outputs.cache-hit != 'true'
        id: haskell
        uses: haskell-actions/setup@v2
        with: { ghc-version: "9.6.6" }

      - name: Plan Haskell oracle build
        if: *NoCacheHit
        run: cabal build shellcheck --dry-run

      - name: Cache Haskell build
        if: *NoCacheHit
        uses: actions/cache@v6
        env:
          CACHE_PREFIX: ${{ runner.os }}-${{ runner.arch }}-cabal-oracle-${{ steps.haskell.outputs.ghc-version }}-${{ steps.haskell.outputs.cabal-version }}
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.CACHE_PREFIX }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}-${{ hashFiles('ShellCheck.cabal', 'cabal.project*', 'src/**', '*.hs', '.github/workflows/rust.yml') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}-
            ${{ env.CACHE_PREFIX }}-

      - name: Build Haskell oracle
        if: *NoCacheHit
        run: |
          cabal build shellcheck
          mkdir -p .cache
          ORACLE="$(cabal list-bin shellcheck)"
          cp "${ORACLE}" .cache/shellcheck-oracle

      - name: Build Rust port (release)
        run: cargo build --release

      - name: Test shellcheck-rs
        run: cargo test -p shellcheck-rs

      - name: Test shellcheck-cli
        run: cargo test -p shellcheck-cli

      - name: Conformance gate
        run: cargo conformance-gate

      - name: Differential fuzz
        run: cargo conformance-fuzz
          --seed "${GITHUB_RUN_NUMBER}"
          --iterations 4000 # --max-findings 50
