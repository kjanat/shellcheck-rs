name: Publish packages
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop execution
        required: true
        type: string
      beepboop_title:
        description: Beepboop run title
        required: false
        type: string
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - id: beepboop_credentials
        uses: kjanat/beepboop/actions/credentials@v1
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          aliases: '["crates-io"]'
      - id: beepboop_publish
        name: Publish selected packages
        run: |-
          cargo publish --locked --package 'rshellcheck-core'
          cargo publish --locked --package 'rshellcheck'
        env:
          CARGO_REGISTRY_TOKEN: ${{
            fromJSON(steps.beepboop_credentials.outputs.values)['crates-io'] }}
      - id: beepboop_token
        uses: kjanat/beepboop/actions/token@v1
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          permission-contents: write
      - id: beepboop_refs
        uses: kjanat/beepboop/actions/publish-refs@v1
        with:
          token: ${{ steps.beepboop_token.outputs.token }}
      - uses: kjanat/beepboop/actions/report@v1
        if: ${{ !cancelled() && steps.beepboop.outcome == 'success' }}
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          publications: "[{\"id\":\"pkg:cargo/rshellcheck\",\"manager\":\"cargo\",\"name\
            \":\"rshellcheck\",\"version\":\"${{
            fromJSON(steps.beepboop.outputs.context).version
            }}\",\"required\":true,\"outcome\":\"${{
            steps.beepboop_publish.outcome == 'success' && 'succeeded' ||
            'failed'
            }}\"},{\"id\":\"pkg:cargo/rshellcheck-core\",\"manager\":\"cargo\",\
            \"name\":\"rshellcheck-core\",\"version\":\"${{
            fromJSON(steps.beepboop.outputs.context).version
            }}\",\"required\":true,\"outcome\":\"${{
            steps.beepboop_publish.outcome == 'success' && 'succeeded' ||
            'failed'
            }}\"},{\"id\":\"pkg:golang/github.com/kjanat/shellcheck-rs/go\",\"m\
            anager\":\"go\",\"name\":\"github.com/kjanat/shellcheck-rs/go\",\"v\
            ersion\":\"${{ fromJSON(steps.beepboop.outputs.context).version
            }}\",\"required\":true,\"outcome\":\"${{ steps.beepboop_refs.outcome
            == 'success' && 'succeeded' || 'failed' }}\"}]"
run-name: ${{ inputs.beepboop_title || github.workflow }}
