name: Publish packages
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop execution
        required: true
        type: string
      beepboop_title:
        description: Beepboop run title
        required: false
        type: string
jobs:
  crates:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: rshellcheck
          operation: crates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - id: beepboop_publish
        name: Publish selected packages
        uses: kjanat/beepboop/actions/publish@v1
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          credentials: '{"CARGO_REGISTRY_TOKEN":"crates-io"}'
    timeout-minutes: 150
run-name: ${{ inputs.beepboop_title || github.workflow }}
