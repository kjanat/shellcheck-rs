name: Release rshellcheck

on:
  push:
    tags: ["rshellcheck-v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/release/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "bindings/wasm/**"
      - "package.json"
      - "package-lock.json"
      - "crates/**"
      - "rust/**"
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: "release-${{ github.ref }}"
  # A new PR revision may replace an old build; a release must finish intact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: { run: { shell: "bash -euo pipefail {0}" } }
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Validate version and plan targets
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rust: ${{ steps.plan.outputs.rust }}
      cross: ${{ steps.plan.outputs.cross }}
      ndk: ${{ steps.plan.outputs.ndk }}
      label: ${{ steps.plan.outputs.label }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.14", version: "0.12.15" }
      - name: Resolve once
        id: plan
        run: uv run --locked --no-dev --package rshellcheck-release rshellcheck-release plan
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with: { toolchain: "${{ steps.plan.outputs.rust }}" }
      - name: Test release tooling
        run: uv run --locked --no-dev --package rshellcheck-release python -m unittest discover -s .github/release -p 'test_*.py' -v

  check:
    name: Rust tests and behavior snapshot
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with: { toolchain: "${{ needs.plan.outputs.rust }}" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-check-${{ runner.os }}-${{ needs.plan.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-${{ hashFiles('crates/**', 'rust/**') }}
          restore-keys: release-check-${{ runner.os }}-${{ needs.plan.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-
      # Oracle-dependent CLI integration tests run in rust.yml, which builds
      # the Haskell oracle. This job gates releases on unit tests and snapshots.
      - run: cargo test --workspace --locked --lib --bins
      - run: cargo run --release --locked -p conformance -- snapshot

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      LABEL: ${{ needs.plan.outputs.label }}
      CROSS_VERSION: ${{ needs.plan.outputs.cross }}
      NDK_VERSION: ${{ needs.plan.outputs.ndk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.14", version: "0.12.15" }
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ needs.plan.outputs.rust }}
          targets: ${{ matrix.target }}
      - name: Cache Rust compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ needs.plan.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**', '.github/release/**') }}-${{ hashFiles('crates/**', 'rust/**') }}
          restore-keys: release-${{ matrix.target }}-${{ needs.plan.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**', '.github/release/**') }}-
      - name: Cache cross
        if: matrix.backend == 'cross'
        id: cross
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cross
          key: release-cross-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.cross }}
      - name: Install cross
        if: matrix.backend == 'cross' && steps.cross.outputs.cache-hit != 'true'
        run: cargo install cross --locked --version "${CROSS_VERSION}"
      - name: Install Android NDK
        if: matrix.backend == 'android'
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"'
      - name: Build and smoke-test
        run: uv run --locked --no-dev --package rshellcheck-release rshellcheck-release build --target "${TARGET}"
      - name: Smoke-test on FreeBSD
        if: contains(matrix.target, 'freebsd')
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          envs: TARGET
          copyback: false
          prepare: pkg install -y python314
          run: python3.14 .github/release/release.py smoke --target "${TARGET}"
      - name: Package binary, license and build metadata
        run: uv run --locked --no-dev --package rshellcheck-release rshellcheck-release pack --target "${TARGET}" --label "${LABEL}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  bindings:
    name: Package JavaScript and Python bindings
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with: { python-version: "3.14", version: "0.13.0" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "26" }
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ needs.plan.outputs.rust }}
          targets: wasm32-unknown-unknown
      - name: Build portable core
        run: cargo build --release --locked -p shellcheck-wasm --target wasm32-unknown-unknown
      - name: Build installable distributions
        run: uv run --locked --no-dev --package rshellcheck-release python -m binding_packages build dist-bindings
      - name: Install and test every distribution in isolation
        run: uv run --locked --no-dev --package rshellcheck-release python -m binding_packages test dist-bindings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binding-npm
          path: dist-bindings/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binding-python-wheel
          path: dist-bindings/*.whl
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binding-python-sdist
          path: dist-bindings/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binding-manifest
          path: dist-bindings/binding-packages.json
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Verify complete release payload
    needs: [plan, check, build, bindings]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env: { LABEL: "${{ needs.plan.outputs.label }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.14", version: "0.13.0" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { pattern: "binary-*", path: dist, merge-multiple: true }
      - name: Check every target and add source archive and checksums
        run: uv run --locked --no-dev --package rshellcheck-release rshellcheck-release assemble --label "${LABEL}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { pattern: "binding-*", path: dist, merge-multiple: true }
      - name: Verify all binding distributions and their source identity
        run: uv run --locked --no-dev --package rshellcheck-release python -m binding_packages verify dist
      - name: Prepare exact released source for SBOM scanning
        run: mkdir sbom-source;
          tar -xzf "dist/rshellcheck-${LABEL}-source.tar.gz" -C sbom-source --strip-components=1
      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: rshellcheck
          SYFT_SOURCE_VERSION: ${{ needs.plan.outputs.label }}
        with:
          path: sbom-source
          format: spdx-json
          syft-version: v1.54.0
          output-file: dist/source.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Validate SBOM and checksum the complete payload
        run: uv run --locked --no-dev --package rshellcheck-release rshellcheck-supply-chain dist --lockfile sbom-source/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rshellcheck-${{ needs.plan.outputs.label }}
          path: dist/*
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete GitHub release
    needs: [plan, assemble]
    if: needs.plan.outputs.publish == 'true' && github.repository == 'kjanat/shellcheck-rs'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: { contents: write, id-token: write, attestations: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      LABEL: ${{ needs.plan.outputs.label }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: "rshellcheck-${{ needs.plan.outputs.label }}", path: dist }
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Sign SLSA build provenance for every payload file
        id: provenance
        uses: actions/attest@7d8b1cacecb65f487779b3b98fd5296a018d1a1b
        with: { subject-path: dist/* }
      - name: Attest the source dependency inventory
        id: sbom
        uses: actions/attest@7d8b1cacecb65f487779b3b98fd5296a018d1a1b
        with:
          subject-path: dist/rshellcheck-${{ env.LABEL }}-source.tar.gz
          sbom-path: dist/source.spdx.json
      - name: Verify signatures and workflow identity before publishing
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          identity=(--repo "${GH_REPO}" --signer-workflow "${GH_REPO}/.github/workflows/release.yml"
            --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}")
          for asset in dist/*; do
            gh attestation verify "${asset}" --bundle "${PROVENANCE_BUNDLE}" "${identity[@]}"
          done
          gh attestation verify "dist/rshellcheck-${LABEL}-source.tar.gz" \
            --bundle "${SBOM_BUNDLE}" --predicate-type https://spdx.dev/Document "${identity[@]}"
          cp "${PROVENANCE_BUNDLE}" dist/provenance.sigstore.json
          cp "${SBOM_BUNDLE}" dist/source-sbom.sigstore.json
      - name: Upload to a draft, then publish
        run: |
          # Recover an interrupted draft; never overwrite a published release.
          if gh release view "${TAG}" --json isDraft > release.json 2> release-error.txt; then
            jq -e '.isDraft == true' release.json
          else
            # An auth/network error must not be mistaken for a missing release.
            if ! grep -qi 'release not found' release-error.txt; then
              cat release-error.txt >&2
              exit 1
            fi
            flags=()
            if [[ "${LABEL}" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "${TAG}" --verify-tag --draft \
              --title "rshellcheck ${LABEL}" --generate-notes "${flags[@]}"
          fi
          gh release upload "${TAG}" dist/* --clobber
          gh release view "${TAG}" --json assets > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {p.name for p in Path("dist").iterdir()}
          actual = {asset["name"] for asset in json.loads(Path("release.json").read_text())["assets"]}
          if actual != expected:
              raise SystemExit(f"Release assets differ: missing={expected - actual}, extra={actual - expected}")
          PY
          # Publication happens only after every upload completes.
          gh release edit "${TAG}" --draft=false
          gh release view "${TAG}" --json url,isDraft > release.json
          jq -e '.isDraft == false' release.json
          jq -r '.url' release.json
