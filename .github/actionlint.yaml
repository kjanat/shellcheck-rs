# yaml-language-server: $schema=https://raw.githubusercontent.com/kjanat/actionlint/v1/actionlint.schema.json
---
assume-default-permissions: restricted
config-variables: [REPO, WIKI, GIT]
policy:
  cache-call-unrestricted: true
  cache-operation: true
  cache-write-untrusted: true
  disallow-suppressions: true
  require-commit-hash: false
  require-job-timeout: { max-minutes: 5 }
  require-permissions: true
paths: { .github/workflows/wiki.yml: { ignore: ['undefined variable "insert"'] } }
