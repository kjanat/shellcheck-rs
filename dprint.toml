#:schema dprint.schema.json
# https://dprint.kjanat.dev/schemas/v0.json
#:tombi toml-version = "v1.1.0"

extends  = "https://raw.githubusercontent.com/kjanat/kjanat/refs/heads/master/configs/dprint.remote.json"
plugins  = [
  "npm:@dprint/exec@0.7.3/plugin.json@704701df449dd7e942a71144773778ac529d68c2e4657bfc236d393b898b9a67",
  "https://plugins.dprint.dev/kjanat/tombi-0.1.1.wasm"
]
excludes = ["shellcheck.1.md", ".github/ISSUE_TEMPLATE/*.md", "validity/matrix.toml", "validity/outcomes.toml", "validity/REPORT.md"]

[exec]
cwd      = "${configDir}"
cacheKey = "1"
timeout  = 30

[[exec.commands]]
command = "rustfmt"
exts    = ["rs"]

[[markdown.overrides]]
files    = ["**/*.md"]
embedded = { sh = [], bash = [] }

[shfmt]
associations = ["manpage"]

[ruff]
preview = true
