#:schema dprint.schema.json
# https://dprint.kjanat.dev/schemas/v0.json
#:tombi toml-version = "v1.1.0"
#:tombi schema.strict = false

extends  = "https://raw.githubusercontent.com/kjanat/kjanat/refs/heads/master/configs/dprint.remote.json"
excludes = [
  "shellcheck.1.md",
  ".github/ISSUE_TEMPLATE/*.md",
  ".github/beepboop.json",
  ".github/workflows/prepare-go.yml",
  ".github/workflows/prepare-release.yml",
  ".github/workflows/publish-crates.yml",
  ".github/workflows/release-go.yml",
  ".github/workflows/release-rshellcheck.yml",
  ".github/workflows/start-release.yml",
]

[exec]
cwd      = "${configDir}"
cacheKey = "1"
timeout  = 30

[[exec.commands]]
command = "rustfmt"
exts    = ["rs"]

[[markdown.overrides]]
files    = ["**/*.md"]
embedded = { sh = [], bash = [] }

[shfmt]
associations = ["manpage"]

[ruff]
preview = true
