#:schema https://dprint.kjanat.dev/schemas/v0.json
#:tombi toml-version = "v1.1.0"

extends  = "https://raw.githubusercontent.com/kjanat/kjanat/refs/heads/master/configs/dprint.remote.json"
plugins  = ["npm:@dprint/exec@0.7.3/plugin.json@704701df449dd7e942a71144773778ac529d68c2e4657bfc236d393b898b9a67"]
excludes = ["shellcheck.1.md", ".github/ISSUE_TEMPLATE/*.md"]

[exec]
cwd      = "${configDir}"
cacheKey = "1"
timeout  = 30

[[exec.commands]]
command = "tombi format - --stdin-filename {{file_path}}"
exts    = ["toml"]

[[exec.commands]]
command = "rustfmt"
exts    = ["rs"]

[shfmt]
associations = [
  "test/*",
  "!test/shellcheck.hs",
  "manpage",
  "nextnumber",
  "quickrun",
  "quicktest",
  "setgitversion",
  "striptests",
]
